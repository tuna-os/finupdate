name: Publish Flatpak

# Build finupdate as a Flatpak OCI image for x86_64 and aarch64, push both to
# GHCR, and update the TunaOS Flatpak index (tunaos.org/flatpak) so
# `flatpak install tuna-os org.tunaos.finupdate` serves current builds on
# either architecture.
#
# Modelled on tuna-os/gtk-office-suite, which is the closest analogue — also
# Rust, also GNOME 50. Two things are inherited from it deliberately:
#
#   * Each arch builds natively on its own runner rather than cross-building
#     under QEMU. Blacksmith runners don't come with binfmt_misc/qemu-user
#     preregistered, so bwrap inside a cross-arch build fails with "Exec
#     format error" — and a full Rust dependency tree under emulation would
#     be painfully slow even where it works.
#   * skopeo is pointed at a writable auth file. Blacksmith's default
#     container auth path (/run/containers/$UID/auth.json) isn't writable.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  APP_ID: org.tunaos.finupdate
  MANIFEST: build-aux/org.tunaos.finupdate.json

jobs:
  build-oci:
    name: Build OCI — ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: build-aux/org.tunaos.finupdate.json
          cache-key: flatpak-publish-${{ github.sha }}-${{ matrix.arch }}
          bundle: finupdate-${{ matrix.arch }}.flatpak
          upload-artifact: false
          arch: ${{ matrix.arch }}

      - name: Export OCI
        run: |
          flatpak build-bundle --oci --arch=${{ matrix.arch }} \
            repo finupdate-${{ matrix.arch }}.oci "$APP_ID"

      - name: Upload OCI artifact
        uses: actions/upload-artifact@v7
        with:
          name: finupdate-${{ matrix.arch }}-oci
          path: finupdate-${{ matrix.arch }}.oci/
          retention-days: 1

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: finupdate-${{ matrix.arch }}-bundle
          path: finupdate-${{ matrix.arch }}.flatpak
          retention-days: 7

  publish:
    name: Publish
    needs: build-oci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: finupdate-x86_64-oci
          # upload-artifact flattens a single-directory `path` to the artifact
          # root, so each arch must download into its own subdirectory —
          # `path: .` for both would put the two index.json/blobs trees in the
          # same place and silently clobber one with the other.
          path: finupdate-x86_64.oci

      - uses: actions/download-artifact@v8
        with:
          name: finupdate-aarch64-oci
          path: finupdate-aarch64.oci

      - name: Push OCI to GHCR
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          skopeo copy oci:finupdate-x86_64.oci \
            docker://ghcr.io/tuna-os/finupdate:latest-x86_64
          skopeo copy oci:finupdate-aarch64.oci \
            docker://ghcr.io/tuna-os/finupdate:latest-aarch64

      - name: Update central index (tuna-os/docs)
        env:
          FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}
        run: |
          git clone --depth 1 \
            https://x-access-token:${FLATPAK_INDEX_TOKEN}@github.com/tuna-os/docs.git \
            index-repo
          pip install requests
          for arch in x86_64 aarch64; do
            python3 .github/scripts/update-index.py \
              --oci-dir "finupdate-${arch}.oci" \
              --index-file index-repo/static/flatpak/index/static \
              --repo-name tuna-os/finupdate \
              --tags latest
          done
          cd index-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/flatpak/index/static
          if git diff --cached --quiet; then
            echo "No index changes"
          else
            git commit -m "chore(flatpak): update finupdate OCI index (x86_64 + aarch64)"
            git push origin main
          fi

  release-bundles:
    name: Attach bundles to release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-bundle'
          merge-multiple: true
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" *.flatpak --clobber \
            --repo "${GITHUB_REPOSITORY}"
