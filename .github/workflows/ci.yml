name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
    container:
      image: fedora:46

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          dnf install -y \
            gtk4-devel \
            libadwaita-devel \
            pango-devel \
            cairo-devel \
            openssl-devel \
            gcc \
            pkgconfig \
            git \
            tar \
            curl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy Lints
        run: |
          cargo clippy --all-targets -- \
            -D clippy::correctness \
            -D clippy::suspicious \
            -W clippy::style \
            -W clippy::complexity \
            -W clippy::perf \
            -A deprecated \
            -A unused

      - name: Start broadway display server
        run: |
          # broadwayd ships with gtk4 on Fedora; start it so the headless
          # GTK test can run. Skip gracefully if the binary isn't present.
          if command -v broadwayd &>/dev/null; then
            broadwayd :0 &
            echo "BROADWAY_PID=$!" >> "$GITHUB_ENV"
            sleep 1
          else
            echo "broadwayd not found – headless GTK test will self-skip"
          fi

      - name: Run Unit Tests
        env:
          GDK_BACKEND: broadway
          BROADWAY_DISPLAY: ":0"
        run: cargo test --workspace --all-targets

      - name: Run Dakota Image History Regression Tests
        env:
          GDK_BACKEND: broadway
          BROADWAY_DISPLAY: ":0"
          RUST_LOG: debug
        run: |
          # Regression tests for Dakota image history fix (commit de1dc08)
          # Tests that sha-only tag probing works correctly for recent builds
          cargo test --test dakota_image_history -- --test-threads=1 --nocapture

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate Code Coverage
        env:
          GDK_BACKEND: broadway
          BROADWAY_DISPLAY: ":0"
        run: |
          # Measure coverage of the testable non-UI layer.
          # The GTK ui/ files, app.rs, dbus_progress.rs and main.rs are
          # deliberately excluded: they require a live display server and
          # are exercised via the GUI smoke tests rather than unit tests.
          EXCLUDE='src/ui/|src/app\.rs|src/dbus_progress\.rs|src/main\.rs'
          cargo llvm-cov --all-features --workspace \
            --ignore-filename-regex "$EXCLUDE"
          cargo llvm-cov --all-features --workspace \
            --ignore-filename-regex "$EXCLUDE" \
            --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
